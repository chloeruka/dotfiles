# ─────────────────────────────────────────────────────────────
# statusline.conf — tokyonight with attitude
# unified docks built with status-format (tmux 3.2+) for proper caps
# ─────────────────────────────────────────────────────────────

# ── palette ──────────────────────────────────────────────────
# base:       #1a1b26  (deep night — status bar background)
# glass:      #24283b  (the dock bed — runs continuously across each side)
# dim-1:      #565f89  (tokyonight comment — muted info)
# dim-2:      #9aa5ce  (tokyonight fg-dark — quieter labels)
# fg-soft:    #a9b1d6  (inactive windows)
# fg-bright:  #c0caf5  (active text)
# accent-purple: #bb9af7  (session label — identity)
# accent-cyan:   #7dcfff  (hostname — the star on the right)
# accent-pink:   #f7768e  (active window — the star on the left, matches pane border)

# ── pane borders ─────────────────────────────────────────────
set-option -g pane-border-lines heavy
set-option -g pane-border-style "fg=#414868"
set-option -g pane-active-border-style "fg=#f7768e"
set-option -g pane-border-indicators colour

# pane titles on top of each pane
# (this format is not nested, so the #I/#W shorthand is fine here)
set-option -g pane-border-status top
set-option -g pane-border-format " ⌜#{pane_index}⌟ #{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{pane_title}} "

# ── status bar base ──────────────────────────────────────────
set -g status on
set -g status-justify "left"
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-interval 5

# message (command prompt, e.g. after prefix + :)
set -g message-style "fg=#c0caf5,bg=#24283b"
set -g message-command-style "fg=#c0caf5,bg=#24283b"

# ── clear defaults so status-format takes over ───────────────
set -g status-left ""
set -g status-right ""
setw -g window-status-separator ""

# ── window formats ───────────────────────────────────────────
# these get expanded via #{E:...} inside status-format[0]'s #{W:...} loop,
# so use full format variables (#{window_index}, #{window_name}) — the
# short-alias forms #I/#W don't work reliably inside nested expansions.

# inactive window: plain text on the glass dock bed
setw -g window-status-format "#[range=window|#{window_index}] #[fg=#7dcfff,bg=#24283b]#{window_index} #[fg=#a9b1d6,bg=#24283b]#{window_name} #[norange]"

# active window: pink pill floats on the glass
setw -g window-status-current-format "#[range=window|#{window_index}]#[fg=#f7768e,bg=#24283b]#[fg=#1a1b26,bg=#f7768e,bold]#{window_index} #{window_name}#[fg=#f7768e,bg=#24283b]#[norange]"

setw -g window-status-activity-style "fg=#7dcfff,bg=#24283b"

# ── status-format: compose the full bar ──────────────────────
# #{E:option} expands the *contents* of an option (the wiki's recommended
# pattern for referencing window-status-format from inside another format).
# #{W:inactive,active} iterates windows — emits `inactive` for each non-current
# window and `active` for the current one, with content after the loop closing
# the dock with a right cap.
set -g status-format[0] "#[align=left]#[fg=#24283b,bg=#1a1b26]#[fg=#bb9af7,bg=#24283b,bold] #S #[fg=#565f89,bg=#24283b]· #{W:#{E:window-status-format},#{E:window-status-current-format}}#[fg=#24283b,bg=#1a1b26]#[align=right]#[fg=#24283b,bg=#1a1b26]#[fg=#565f89,bg=#24283b]󰃵 %Y-%m-%d #[fg=#414868,bg=#24283b]·#[fg=#9aa5ce,bg=#24283b] 󰃰 %H:%M #[fg=#414868,bg=#24283b]·#[fg=#7dcfff,bg=#24283b,bold] 󰌢 #h #[fg=#24283b,bg=#1a1b26]"
